[package]
name = "nothing-x"
description = "Nothing X App — unofficial macOS companion for Nothing & CMF earbuds"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "nothing-x"

[[bin]]
name = "nothing-x"
path = "src/main.rs"

[[bin]]
name = "nothingctl"
path = "src/bin/nothingctl.rs"

[dependencies]
nothing-protocol.workspace = true
nothing-bt.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSLocale", "NSArray", "NSString"] }
